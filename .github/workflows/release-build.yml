name: Windows release build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.lock
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run source tests
        shell: pwsh
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: Build locked Python 3.12 onedir package
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0-ci" }
          ./scripts/build_release.ps1 -Clean -Version $version -PythonExe (Get-Command python).Source
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0-ci" }
          ./scripts/build_installer.ps1 -Version $version
      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeBiliLocalizer-windows-x64
          path: |
            releases/*.zip
            releases/*-setup.exe
            releases/*.sha256
          if-no-files-found: error
